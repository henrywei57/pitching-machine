[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "knuckle"
version = "0.1.0"
description = "A two-wheel pitching machine in MuJoCo, with seam-dependent knuckleball aerodynamics and a virtual instrumented baseball."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Henry Wei" }]
dependencies = ["mujoco>=3.1", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
render = ["imageio>=2.30", "pillow>=10"]
bullet = ["pybullet>=3.2"]
dev = ["pytest>=7", "imageio>=2.30", "pillow>=10"]

[tool.setuptools]
packages = ["knuckle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
